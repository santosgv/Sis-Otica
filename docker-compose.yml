version: '3'

services:
  # ============================================
  # STACK DE MONITORAMENTO (ELK)
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.14.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
    ports:
      - 9200:9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:7.14.0
    container_name: kibana
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    networks:
      - elastic

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:7.14.0
    container_name: metricbeat
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
      - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml
    command: metricbeat -e -system.hostfs=/hostfs
    restart: on-failure
    depends_on:
      - kibana
    networks:
      - elastic

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:7.13.0
    container_name: heartbeat
    volumes:
      - ./heartbeat.yml:/usr/share/heartbeat/heartbeat.yml
    environment:
      - setup.kibana.host=kibana:5601
    networks:
      - elastic

  apm:
    image: docker.elastic.co/apm/apm-server-oss:7.13.0
    container_name: apm
    volumes:
      - ./apm-server.yml:/usr/share/apm-server/apm-server.yml
    ports:
      - "8200:8200"
    restart: on-failure
    networks:
      - elastic

  # ============================================
  # EVOLUTION API (WhatsApp)
  # ============================================
  evolution-api:
    image: atendai/evolution-api:v1.8.2
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env.evolution
    depends_on:
      - evolution-postgres
      - evolution-redis
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - elastic

  # Banco de dados dedicado da Evolution API
  evolution-postgres:
    image: postgres:14-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=${EVOLUTION_POSTGRES_USER:-evolution}
      - POSTGRES_PASSWORD=${EVOLUTION_POSTGRES_PASSWORD:-evolution_secret}
      - POSTGRES_DB=${EVOLUTION_POSTGRES_DB:-evolution_db}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Porta 5433 para não conflitar com o postgres do projeto
    networks:
      - elastic

  # Redis para cache da Evolution API
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    networks:
      - elastic

networks:
  elastic:
    driver: bridge

volumes:
  esdata:
    driver: local

  pgdata:
    driver: local

  # Volumes da Evolution API
  evolution_postgres_data:
    driver: local
  evolution_redis_data:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local