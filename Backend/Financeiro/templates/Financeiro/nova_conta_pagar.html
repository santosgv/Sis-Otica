{% extends 'base.html' %}

{% block 'title' %}Nova Conta a Pagar{% endblock %}

{% block 'body' %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb bg-white p-2 rounded-2">
    <li class="breadcrumb-item"><a href="{% url 'Core:home' %}">Página Principal</a></li>
    <li class="breadcrumb-item"><a href="{% url 'Financeiro:contas_a_pagar' %}">Contas a Pagar</a></li>
    <li class="breadcrumb-item active" aria-current="page">Nova</li>
  </ol>
</nav>

{% if messages %}
  {% for message in messages %}
    <div class="alert {{ message.tags }}">{{ message }}</div>
  {% endfor %}
{% endif %}

<div class="card shadow-sm border-0" style="max-width: 500px;">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <input type="text" name="DESCRICAO" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Valor Total</label>
        <input type="text" name="VALOR_TOTAL" class="form-control" placeholder="Ex: 1500,00" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Quantidade de Parcelas</label>
        <input type="number" name="QUANTIDADE_PARCELAS" class="form-control" value="1" min="1" required>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-check"></i> Criar Conta a Pagar
      </button>
    </form>
  </div>
</div>
{% endblock %}
